name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # No version here on purpose: the action reads the pinned
      # `packageManager` field from package.json, which is the single
      # authority. The floating `latest` this carried is how pnpm 10.x's
      # Node >= 22.13 requirement arrived uninvited and broke the build.
      - name: Set up pnpm
        uses: pnpm/action-setup@v3

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          # 22, matching @types/node ^22 and the tests' use of node:sqlite,
          # which ships unflagged from 22.13. The previous '20' had neither.
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run tests
        run: pnpm test
