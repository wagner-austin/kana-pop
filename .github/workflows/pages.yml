name: gh-pages

on:
  push:
    branches: [main, reboot]
  workflow_dispatch: # lets you trigger a manual rebuild

permissions:
  contents: write # allow git push
  id-token: write # future-proof (OIDC / Pages)

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # No version pins here on purpose: pnpm comes from package.json's
      # packageManager field (the single authority), and Node matches ci.yml.
      # The floating latest/latest pair this carried left the post-job pnpm
      # cache save pointing at a store path that did not exist, which marked
      # an otherwise-successful deploy as a failed job.
      - uses: pnpm/action-setup@v3

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Build with the correct path for GitHub Pages
      - name: Build site
        run: |
          BASE_PATH=/kana-pop/ pnpm build

      - name: Deploy to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: docs # vite writes here (outDir in vite.config.ts)
